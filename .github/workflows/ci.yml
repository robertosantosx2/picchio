name: Picchio CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cpu-build-and-self-test:
    name: Ubuntu CPU build and synthetic self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build
        run: make -j2

      - name: Run synthetic self-test
        run: ./picchio --self-test

      - name: Check patch whitespace
        run: git diff --check
